name: oran-monitoring

services:
  # ---- role: exporters (run on the lab VM) ----
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: oran-node-exporter
    restart: unless-stopped
    profiles: [exporters]
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: oran-cadvisor
    restart: unless-stopped
    profiles: [exporters]
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"

  # ---- role: monitor (run on the second VM) ----
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: oran-prometheus
    restart: unless-stopped
    profiles: [monitor]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: oran-grafana
    restart: unless-stopped
    profiles: [monitor]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  prom-data:
