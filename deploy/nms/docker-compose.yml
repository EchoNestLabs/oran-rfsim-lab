# open5gs-nms for the lab — optional topology/monitoring UI.
# Start with ./start.sh (requires the lab stack to be up: it hooks the AMF
# container's network+PID namespaces and reads the lab's real NF configs).
#
# Provenance & license: built from a pinned commit of
# https://github.com/paulmataruso/open5gs-nms (AGPL-3.0) plus the source
# patch in patches/ — see README.md and build.sh.
name: oran-nms

services:
  backend:
    image: oran/open5gs-nms-backend:${NMS_SHA:-54c405d634768c4cb27d3ef52d6e9c6114695aad}
    container_name: open5gs-nms-backend
    restart: unless-stopped
    privileged: true
    network_mode: "container:oran-amf"
    # Host PID namespace: the service-status /proc fallback must see ALL NF
    # daemon processes (open5gs-nrfd, open5gs-smfd, mongod, ...). Sharing the
    # AMF container's PID ns would only expose open5gs-amfd and mark every
    # other node red in the topology.
    pid: "host"
    volumes:
      - ./data:/app/data
      - ../rfsim-compose/config/open5gs:/etc/open5gs:ro
    environment:
      - TZ=Europe/Stockholm
      - NODE_ENV=production
      - PORT=3001
      - WS_PORT=3002
      - MONGODB_URI=mongodb://10.71.0.10:27017/open5gs
      - LOG_LEVEL=info
      - AUTH_DB_PATH=/app/data/auth.db
      - SESSION_MAX_AGE=86400
      - FIRST_RUN_PASSWORD=${FIRST_RUN_PASSWORD:-}

# No default password: on first sign-in the NMS prompts to set the admin
# password (set FIRST_RUN_PASSWORD in the environment to preseed it).
      - COOKIE_SECURE=false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: oran/open5gs-nms-frontend:${NMS_SHA:-54c405d634768c4cb27d3ef52d6e9c6114695aad}
    container_name: open5gs-nms-frontend
    restart: unless-stopped
    network_mode: host
    # 8081 is taken by the lab's cAdvisor — serve on 8083
    command: ["serve", "-s", "dist", "-l", "8083"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: open5gs-nms-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nms.conf:/etc/nginx/conf.d/nms.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
